<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ski slopes of Gudauri under a cold blue sky">
  <defs>
    <linearGradient id="gu-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12233a"/>
      <stop offset="0.6" stop-color="#3f6288"/>
      <stop offset="1" stop-color="#bcd2e0"/>
    </linearGradient>
    <linearGradient id="gu-snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b8c6d2"/>
    </linearGradient>
    <radialGradient id="gu-vig" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.38"/>
    </radialGradient>
    <filter id="gu-grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#gu-sky)"/>
  <circle cx="1240" cy="300" r="70" fill="#fff" opacity="0.85"/>
  <polygon points="0,540 320,360 640,540 900,380 1200,540 1600,400 1600,700 0,700" fill="#5a6f85" opacity="0.5"/>
  <polygon points="0,620 360,460 760,620 1120,470 1600,600 1600,1000 0,1000" fill="url(#gu-snow)"/>
  <polygon points="640,540 720,440 800,540" fill="#dbe6ee"/>
  <!-- chairlift line -->
  <g stroke="#1c2a3a" stroke-width="3">
    <line x1="120" y1="900" x2="1000" y2="470"/>
  </g>
  <g fill="#1c2a3a">
    <rect x="120" y="880" width="8" height="60"/>
    <rect x="560" y="672" width="8" height="40"/>
    <rect x="1000" y="452" width="8" height="30"/>
    <rect x="300" y="782" width="26" height="16"/>
    <rect x="500" y="686" width="26" height="16"/>
    <rect x="720" y="580" width="26" height="16"/>
  </g>
  <rect width="1600" height="1000" fill="url(#gu-vig)"/>
  <rect width="1600" height="1000" filter="url(#gu-grain)" opacity="0.5"/>
</svg>
