<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Jvari Monastery above Mtskheta">
  <defs>
    <linearGradient id="mt-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20303a"/>
      <stop offset="0.55" stop-color="#5f7370"/>
      <stop offset="1" stop-color="#c9b98a"/>
    </linearGradient>
    <linearGradient id="mt-hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5236"/>
      <stop offset="1" stop-color="#2f2c20"/>
    </linearGradient>
    <radialGradient id="mt-vig" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.4"/>
    </radialGradient>
    <filter id="mt-grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#mt-sky)"/>
  <polygon points="0,520 380,440 760,500 1120,430 1600,500 1600,1000 0,1000" fill="#4a5350" opacity="0.5"/>
  <polygon points="0,640 420,540 900,620 1600,560 1600,1000 0,1000" fill="url(#mt-hill)"/>
  <!-- Jvari monastery -->
  <g fill="#211d16">
    <rect x="740" y="470" width="120" height="90"/>
    <rect x="778" y="418" width="44" height="52"/>
    <polygon points="800,382 828,418 772,418"/>
    <rect x="796" y="366" width="8" height="16"/>
  </g>
  <!-- river confluence -->
  <path d="M0 820 q 400 -40 800 20 q 400 60 800 10 L1600 1000 0 1000 Z" fill="#3a4a52" opacity="0.7"/>
  <path d="M0 880 q 500 -20 900 30 q 350 40 700 0 L1600 1000 0 1000 Z" fill="#28343a"/>
  <rect width="1600" height="1000" fill="url(#mt-vig)"/>
  <rect width="1600" height="1000" filter="url(#mt-grain)" opacity="0.5"/>
</svg>
